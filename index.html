<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Crank Slider Karakuri AR</title>

  <!-- A-Frame + AR.js + Extras -->
  <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
  <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
  <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }

    #trivia-box {
      position: fixed;
      top: 10px;
      left: 10px;
      right: 10px;
      max-width: 360px;
      background-color: rgba(0, 0, 0, 0.55);
      color: white;
      font-size: 13px;
      padding: 10px 14px;
      border-radius: 8px;
      z-index: 2;
      line-height: 1.4em;
      pointer-events: none;
    }

    #toggleAnimBtn {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      background-color: rgba(255,255,255,0.85);
      color: black;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <!-- Trivia overlay -->
  <div id="trivia-box">
    <strong>Crank Slider Karakuri:</strong><br>
    This mechanism converts rotary motion into linear motion using a crank, connecting rod, and slider. It's famously used in engine pistons.<br><br>
    In Karakuri, this setup enables precise push-and-pull actions without motors—perfect for lean, repeatable movements.
  </div>

  <!-- AR scene -->
  <a-scene
    embedded
    vr-mode-ui="enabled: false;"
    loading-screen="enabled: false;"
    shadow="type: pcfsoft"
    renderer="logarithmicDepthBuffer: true; antialias: true; shadowMapEnabled: true; shadowMapType: PCFSoftShadowMap;"
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    gesture-detector
  >
    <!-- Assets -->
    <a-assets>
      <a-asset-item id="animated-asset" src="assets/asset.glb"></a-asset-item>
    </a-assets>

    <!-- Lights -->
    <a-entity light="type: ambient; intensity: 0.6"></a-entity>
    <a-entity
      light="type: directional; color: #ffffff; intensity: 0.85; castShadow: true"
      position="1.5 3 2"
      rotation="-60 30 0"
      shadow-camera-near="0.1"
      shadow-camera-far="10"
      shadow-camera-left="-2"
      shadow-camera-right="2"
      shadow-camera-top="2"
      shadow-camera-bottom="-2"
      shadow-map-width="4096"
      shadow-map-height="4096"
    ></a-entity>

    <!-- Shadow catcher plane -->
    <a-entity
      geometry="primitive: plane; width: 1.2; height: 1.2;"
      rotation="-90 0 0"
      material="color: #ccc; opacity: 0.001; transparent: true"
      shadow="receive: true"
    ></a-entity>

    <!-- Marker -->
    <a-marker
      id="animated-marker"
      type="pattern"
      preset="custom"
      url="assets/marker.patt"
      raycaster="objects: .clickable"
      emitevents="true"
      cursor="fuse: false; rayOrigin: mouse;"
    >
      <a-entity
        id="model"
        gltf-model="#animated-asset"
        class="clickable"
        scale="0.012692 0.012692 0.012692"
        animation-mixer="loop: repeat"
        gesture-handler
        shadow="cast: true"
      ></a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Toggle Animation -->
  <button id="toggleAnimBtn">Pause Animation</button>

  <script>
    const toggleBtn = document.getElementById("toggleAnimBtn");
    const model = document.querySelector("#model");

    let isPaused = false;
    toggleBtn.addEventListener("click", () => {
      if (!model) return;
      model.setAttribute("animation-mixer", `timeScale: ${isPaused ? 1 : 0}`);
      toggleBtn.textContent = isPaused ? "Pause Animation" : "Play Animation";
      isPaused = !isPaused;
    });
  </script>
</body>
</html>
